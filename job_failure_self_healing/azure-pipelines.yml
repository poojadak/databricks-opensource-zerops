trigger:
  branches:
    include:
      - development

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: "3.11"

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "$(pythonVersion)"
    displayName: "Use Python $(pythonVersion)"

  - script: python -m pip install .
    displayName: "Install project and test dependencies"

  - script: python -m unittest discover -s tests -v
    displayName: "Run unit tests"

  - script: python -m pip wheel . --no-deps --wheel-dir dist
    displayName: "Build wheel"

  - publish: dist
    artifact: job-failure-healing-wheel
    displayName: "Publish wheel artifact"
