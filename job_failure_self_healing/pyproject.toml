[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job_failure_self_healing"
version = "0.1.0"
description = "Auditable, proposal-first triage for failed Databricks jobs"
requires-python = ">=3.10"
dependencies = [
    "databricks-sdk>=0.49.0",
]

[project.scripts]
run = "job_failure_self_healing.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
